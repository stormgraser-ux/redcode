# Fresh-Windows smoke test for redcode.
#
# Every run is a pristine GitHub-hosted Windows image: no pi, no redcode, no
# leftover config — the machine a user gets the first time they follow the
# README. That is exactly the path the README's Windows section is honest
# about never having been run on a real machine, and a local VM is worse at
# simulating it (state accumulates the moment you install anything).
#
# Three jobs:
#
#   install-smoke   always, on push/PR. Fresh image -> Node (22 and 24) ->
#                   npm -g pi -> Git Bash ./install.sh -> unit tests ->
#                   pi-patch -> one full round trip of real pi + real profile
#                   against the bundled mock OpenAI server. No secrets needed.
#
#   e2e             on "Run workflow" with run-e2e checked. Same, but the
#                   runner joins your tailnet and the round trip goes to your
#                   real model server with a real key. This is the one that
#                   needs secrets — see docs/windows-ci.md.
#
#   desktop         on "Run workflow" with run-desktop checked. Installs
#                   nothing: joins the tailnet, turns on Remote Desktop, and
#                   holds the pristine machine open so you can drive the
#                   install by hand and watch it. Read the security note
#                   above that job before enabling it.
#
# On failure either test job ends in mxschmitt/action-tmate: a ~30 minute
# window in which the still-alive runner hands you a shell, so a red run can
# be poked at instead of guessed at. This repo is PUBLIC and Actions logs are
# world-readable, so tmate is pinned to limit-access-to-actor: only the
# GitHub account that triggered the run can attach, using its account SSH
# keys. Without that, the connection string in a failed public run is an open
# shell for anyone watching — and on a tailnet-joined runner that shell is
# inside your tailnet.
#
# Windows minutes burn at 2x on GitHub-hosted runners, so keep the triggers
# as-is: automatic for the cheap mock job, manual for the tailnet jobs.

name: Windows smoke

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      run-e2e:
        description: "Round trip against the real model server over the tailnet (needs the secrets from docs/windows-ci.md)"
        type: boolean
        default: false
      run-desktop:
        description: "Hold a pristine Windows desktop open on the tailnet over RDP, so you can drive the install by hand"
        type: boolean
        default: false
      desktop-minutes:
        description: "How long to hold that desktop open, in minutes (5-110, billed at 2x)"
        type: string
        default: "45"

permissions:
  contents: read

concurrency:
  # Pushes supersede each other — a run against stale code is worthless.
  # Manual runs must NOT share that fate: the desktop job is a machine
  # someone is sitting in front of, and a push to master would yank it out
  # from under them mid-session (observed: a session died 75 seconds in,
  # looking exactly like a network fault). Give every dispatch its own
  # group so nothing can cancel it but the person who started it.
  group: windows-smoke-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: true

jobs:
  install-smoke:
    name: fresh install (node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The two Node LTS lines a user plausibly has today. Remove
        # setup-node if you want to test the node the image ships instead.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - name: Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Fingerprint (what a fresh machine looks like today)
        shell: pwsh
        run: |
          $PSVersionTable.OS
          node --version
          npm --version
          git --version
          & 'C:\Program Files\Git\bin\bash.exe' --version | Select-Object -First 1

      - name: Install pi (the npm package, as the README says)
        shell: pwsh
        run: |
          npm install -g @earendil-works/pi-coding-agent
          pi --version

      - name: Install redcode + unit tests + patch check (Git Bash)
        shell: pwsh
        run: |
          & 'C:\Program Files\Git\bin\bash.exe' ./scripts/windows-smoke.sh install

      - name: Smoke — full round trip against the local mock (Git Bash)
        shell: pwsh
        run: |
          & 'C:\Program Files\Git\bin\bash.exe' ./scripts/windows-smoke.sh smoke

      - name: tmate — interactive shell on this runner while it still exists
        if: ${{ failure() && github.event_name == 'workflow_dispatch' }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30
        with:
          # Public repo: the connection string is world-readable in the log.
          limit-access-to-actor: true

  e2e:
    name: real server over the tailnet
    needs: install-smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run-e2e == true }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Node 22 (the version this repo is developed against)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pi (the npm package, as the README says)
        shell: pwsh
        run: |
          npm install -g @earendil-works/pi-coding-agent
          pi --version

      - name: Check the secrets are actually set
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          ENDPOINT: ${{ secrets.REDCODE_BASE_URL }}
          KEY: ${{ secrets.REDCODE_API_KEY }}
        run: |
          $missing = @()
          if (-not $env:TS_AUTHKEY) { $missing += "TAILSCALE_AUTHKEY" }
          if (-not $env:ENDPOINT)   { $missing += "REDCODE_BASE_URL" }
          if (-not $env:KEY)        { $missing += "REDCODE_API_KEY" }
          if ($missing.Count -gt 0) {
            throw "Missing repository secrets: $($missing -join ', '). See docs/windows-ci.md."
          }

      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          # The auth key is tagged, so the node joins as tag:ci and gets
          # only the grant scoped to it — not your user's rights.
          tags: tag:ci

      - name: Verify the endpoint answers from the tailnet
        shell: pwsh
        env:
          ENDPOINT: ${{ secrets.REDCODE_BASE_URL }}
          KEY: ${{ secrets.REDCODE_API_KEY }}
        run: |
          $r = Invoke-WebRequest -UseBasicParsing "$env:ENDPOINT/models" -Headers @{ Authorization = "Bearer $env:KEY" }
          "endpoint reachable ($($r.StatusCode)): $($r.Content.Substring(0, [Math]::Min(200, $r.Content.Length)))"

      - name: Install redcode + unit tests + patch check (Git Bash)
        shell: pwsh
        run: |
          & 'C:\Program Files\Git\bin\bash.exe' ./scripts/windows-smoke.sh install

      - name: Smoke — round trip against the real model (Git Bash)
        shell: pwsh
        env:
          REDCODE_BASE_URL: ${{ secrets.REDCODE_BASE_URL }}
          REDCODE_API_KEY: ${{ secrets.REDCODE_API_KEY }}
          REDCODE_MODEL: ${{ secrets.REDCODE_MODEL }}
        run: |
          & 'C:\Program Files\Git\bin\bash.exe' ./scripts/windows-smoke.sh smoke

      - name: "tmate — interactive shell (this runner is on the tailnet)"
        if: ${{ failure() }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 30
        with:
          # This runner holds a live key to your model server and sits inside
          # your tailnet. Never drop limit-access-to-actor from this one.
          limit-access-to-actor: true

  # ---------------------------------------------------------------------
  # A fresh Windows machine you drive yourself, with your eyes.
  #
  # Installs nothing. It joins the tailnet, turns on Remote Desktop, drops a
  # crib sheet on the desktop, and then waits. Connect from any tailnet box
  # and you are sitting at the exact pristine machine a first-time reader of
  # the README gets — then follow the README by hand and watch every step
  # succeed or fail. Cancel the run when you are done.
  #
  # SECURITY. Read this before enabling it.
  #
  #   * This makes the runner LISTEN on 3389 on a tailnet interface. Every
  #     other node on your tailnet can reach it. tmate, by contrast, is an
  #     outbound tunnel that listens for nothing. This is the real difference
  #     between the two, and it is why this job is opt-in per run.
  #   * Give the Tailscale auth key a TAG (tag:ci) and write an ACL that
  #     lets that tag reach only your model server's port. Untagged, the
  #     ephemeral runner joins as YOUR user and inherits your rights across
  #     the whole tailnet — a much bigger deal than the open 3389.
  #   * RDP_PASSWORD must be long and random. It is a repo secret, so GitHub
  #     masks it in logs, but masking is best-effort and any transform of the
  #     value defeats it. Never echo it, even partially.
  #   * Network Level Authentication stays ON. It is what keeps an unauthed
  #     peer from opening a session at all.
  #   * The runner is a shared-tenancy VM that belongs to GitHub, temporarily
  #     inside your private network. Do not sign into anything on it that you
  #     would not sign into on a stranger's laptop.
  #   * No model-server secrets are put in this job's environment on purpose.
  #     You are here to test the install path, and /connect will ask you for
  #     an endpoint interactively — which is the flow you actually want to
  #     watch anyway.
  # ---------------------------------------------------------------------
  desktop:
    name: pristine desktop, held open on the tailnet
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run-desktop == true }}
    runs-on: windows-latest
    # Hard ceiling enforced by the runner. The hold loop stops before this.
    timeout-minutes: 120
    steps:
      - name: Check the secrets are actually set
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $missing = @()
          if (-not $env:TS_AUTHKEY)   { $missing += "TAILSCALE_AUTHKEY" }
          if (-not $env:RDP_PASSWORD) { $missing += "RDP_PASSWORD" }
          if ($missing.Count -gt 0) {
            throw "Missing repository secrets: $($missing -join ', '). See docs/windows-ci.md."
          }
          if ($env:RDP_PASSWORD.Length -lt 20) {
            throw "RDP_PASSWORD is under 20 characters. This password fronts a desktop on your tailnet — regenerate it long and random."
          }

      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          # The auth key is tagged, so the node joins as tag:ci and gets
          # only the grant scoped to it — not your user's rights.
          tags: tag:ci

      - name: Turn on Remote Desktop for the runner account
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          # runneradmin is the account this job already runs as, and it is a
          # local administrator. It has no usable password until we set one.
          net user runneradmin "$env:RDP_PASSWORD" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "could not set the runneradmin password" }

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections -Value 0

          # Network Level Authentication ON. The port is tailnet-only, but NLA
          # is what stops a peer opening a session before authenticating.
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication -Value 1

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-Service  -Name TermService -StartupType Automatic
          Start-Service -Name TermService
          "Remote Desktop is up for user 'runneradmin'."

      - name: Leave a crib sheet on the desktop
        shell: pwsh
        run: |
          # So you are not alt-tabbing to the README on another machine.
          $desktop = [Environment]::GetFolderPath('Desktop')
          $lines = @(
            'redcode — fresh Windows install, by hand'
            '========================================'
            ''
            'This machine is pristine. Nothing is installed. Open Git Bash'
            '(Start -> "Git Bash") and work through these:'
            ''
            '  1. node --version          # the image ships one; if missing,'
            '                             # install Node LTS from nodejs.org'
            ''
            '  2. npm install -g @earendil-works/pi-coding-agent'
            '     pi --version'
            ''
            '  3. git clone https://github.com/stormgraser-ux/redcode.git'
            '     cd redcode'
            '     ./install.sh'
            ''
            '  4. pi'
            '     /connect                # paste your endpoint + key here'
            '     then ask it something.'
            ''
            'What to watch for, in order of how likely it is to bite:'
            '  - install.sh must run under GIT BASH, not PowerShell or CMD.'
            '  - a path with a space in it (this account has none, a real'
            '    user might).'
            '  - CRLF: git may check the repo out with Windows line endings'
            '    and bash then fails on the shebang. Symptom is a weird'
            '    "\r: command not found".'
            '  - the profile lands in %USERPROFILE%\.pi\agent — check it.'
            ''
            'This machine is DESTROYED when the workflow run ends. Nothing'
            'you do here persists. Cancel the run from the Actions tab when'
            'you are finished, so you stop paying for it.'
          )
          $lines | Set-Content -Path (Join-Path $desktop 'START-HERE.txt') -Encoding UTF8
          "crib sheet written to the desktop"

      - name: Where to connect
        shell: pwsh
        run: |
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $ip = (& $ts ip -4 | Select-Object -First 1).Trim()
          $name = ((& $ts status --json | ConvertFrom-Json).Self.DNSName).TrimEnd('.')
          "==================================================================="
          "  Remote Desktop to:  $ip"
          "  or by name:         $name"
          "  User:               runneradmin"
          "  Password:           your RDP_PASSWORD repo secret"
          ""
          "  From Linux:"
          "    xfreerdp3 /v:$ip /u:runneradmin /dynamic-resolution +clipboard"
          ""
          "  The machine is PRISTINE — nothing is installed. That is the"
          "  point. There is a START-HERE.txt on the desktop."
          "==================================================================="

      - name: What this node can actually see
        shell: pwsh
        run: |
          # An ACL failure is silent in the direction that matters: a node
          # with too MUCH access looks identical to one scoped correctly,
          # until something goes wrong. Tailscale filters the netmap by
          # policy, so the peer list is the observable proof. A correctly
          # scoped tag:ci should see the model server and very little else
          # — if your phone and your NAS are in this list, the grant is not
          # biting and the tag bought you nothing.
          $ts = "C:\Program Files\Tailscale\tailscale.exe"
          $st = & $ts status --json | ConvertFrom-Json
          $tags = $st.Self.Tags
          if ($tags) { "this node is tagged: $($tags -join ', ')" }
          else {
            Write-Warning "THIS NODE IS UNTAGGED — it joined as your user and inherited your rights across the whole tailnet. The auth key is not tagged, or tags: was not passed."
          }
          $peers = @($st.Peer.PSObject.Properties.Value)
          "visible peers: $($peers.Count)"
          $peers | ForEach-Object { "  {0,-24} {1}" -f $_.HostName, $_.TailscaleIPs[0] }

          # Visibility is NOT reachability. Tailscale populates the peer list
          # partly for connectivity setup, so a correctly scoped node can
          # still SEE names the packet filter will not let it talk to. The
          # only way to tell a working grant from a broken one is to open a
          # socket, so probe every visible peer on a couple of ports and let
          # the result speak.
          #
          # Expected on a correctly scoped tag:ci: the model server's serve
          # port is the single OPEN result, everything else refused or timed
          # out. Anything else open means some other rule still covers
          # tagged nodes.
          function Probe($ip, $port) {
            $c = New-Object System.Net.Sockets.TcpClient
            try {
              if ($c.ConnectAsync($ip, $port).Wait(1500) -and $c.Connected) { return "OPEN" }
              return "blocked"
            } catch { return "blocked" }
            finally { $c.Dispose() }
          }
          ""
          "reachability probe (1.5s timeout each):"
          foreach ($p in $peers) {
            if (-not $p.Online) { continue }
            $ip = $p.TailscaleIPs[0]
            foreach ($port in 8449, 22, 445, 5000, 80) {
              $r = Probe $ip $port
              if ($r -eq "OPEN") { "  {0,-24} {1,-6} {2}" -f $p.HostName, $port, $r }
            }
          }
          "  (only OPEN results are listed; silence below a host means nothing answered)"

      - name: Hold the machine open
        shell: pwsh
        env:
          # Passed via env rather than inline interpolation, so the dispatch
          # input can never be spliced into the script body.
          HOLD_MINUTES: ${{ inputs.desktop-minutes }}
        run: |
          $minutes = 45
          [void][int]::TryParse($env:HOLD_MINUTES, [ref]$minutes)
          $minutes = [Math]::Max(5, [Math]::Min(110, $minutes))
          "Holding this desktop for $minutes minutes."
          "Cancel the run from the Actions tab to release it early."
          for ($i = $minutes; $i -gt 0; $i--) {
            "$i minute(s) left"
            Start-Sleep -Seconds 60
          }
          "Time is up — the runner is being destroyed."